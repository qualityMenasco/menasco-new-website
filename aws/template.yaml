# Phase 6A — proposed AWS SAM template for the Newsroom API Lambda +
# API Gateway HTTP API. NOT DEPLOYED. This file provisions nothing by
# itself — `sam deploy` would need to be run deliberately, by a human, with
# real parameter values, after reviewing this template. Written now purely
# so the exact resources this migration needs are documented as reviewable,
# versioned code rather than a list of manual click-through instructions.
#
# Why SAM over raw CloudFormation or a heavier framework (CDK/Terraform):
# this is one Lambda function behind one HTTP API route — SAM's few
# resource types (AWS::Serverless::Function, AWS::Serverless::HttpApi) are
# already the minimum expressive surface for that, with `sam build`/`sam
# deploy` as the only new tooling required. CDK/Terraform would add a
# second infrastructure language and state-management model to a project
# that has neither today, for no capability this migration actually needs.
#
# VPC/subnet/security-group parameters are left as REQUIRED, no defaults —
# this template cannot be deployed without deliberately supplying them,
# which is exactly the point: nothing here should ever accidentally
# provision with a wrong or wide-open network configuration.

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MENASCO Newsroom API — Lambda + API Gateway HTTP API adapter (Phase 6A)

Parameters:
  DbHost:
    Type: String
    Description: RDS endpoint (mneasco-newsroom-db...rds.amazonaws.com) — passed as a Lambda env var, not baked into the template.
  DbName:
    Type: String
    Default: menasco_newsroom
  DbUser:
    Type: String
    Default: newsroom_app
    Description: Must be the CRUD-only newsroom_app user — never newsroom_admin.
  DbPasswordSecretArn:
    Type: String
    Description: ARN of a Secrets Manager secret holding newsroom_app's password. Never pass the raw password as a template parameter (it would land in CloudFormation's event history in plaintext).
  NewsroomS3Bucket:
    Type: String
    Default: menasco-newsroom-prod
  NewsroomAdminApiKeySecretArn:
    Type: String
    Description: ARN of a Secrets Manager secret holding NEWSROOM_ADMIN_API_KEY.
  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet(s) in the same VPC as the RDS instance, with a route to it. REQUIRED — no default, so this template cannot silently deploy Lambda outside the RDS-reachable network.
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: A NEW, dedicated security group for this Lambda (see the Phase 6A report's "Lambda security-group plan") — do not reuse an existing broad security group.

Resources:
  NewsroomFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: menasco-newsroom-api
      # aws/newsroom-lambda.ts's exported `handler` — bundled by `sam build`'s
      # esbuild integration (see Metadata.BuildProperties below), same
      # TypeScript source the offline/real adapter tests already exercise.
      Handler: newsroom-lambda.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      CodeUri: ../
      # 128 MB / 3s (Lambda's raw platform defaults) were what the currently
      # deployed function actually ran with, never aligned to this template —
      # confirmed by a real Production timeout: a 2-page, 29KB text PDF hit the
      # 3s ceiling at ~115MB/128MB used, mid-way through unpdf/pdf.js
      # extraction (CloudWatch REPORT line, RequestId
      # c6efceba-d494-4344-a627-8bcfc7431dc8, 2026-09-16). 256/30 is this
      # template's actual source of truth going forward — comfortable
      # headroom for PDF processing (unpdf/pdf.js is the slowest path) without
      # over-provisioning a function that otherwise does small JSON/RDS/S3
      # work. Whoever next deploys/updates this Lambda (currently manual
      # AWS Console upload, not `sam deploy` — see this file's own header)
      # must bring the live configuration in line with these two values.
      MemorySize: 256
      Timeout: 30
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds: [!Ref LambdaSecurityGroupId]
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: '3306'
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Sub '{{resolve:secretsmanager:${DbPasswordSecretArn}}}'
          AWS_REGION_OVERRIDE_NOTE: '' # AWS_REGION itself is a reserved Lambda env var, auto-populated by the runtime — never set explicitly, see api/_lib/s3.ts's requireEnv('AWS_REGION') call, which reads this same reserved variable.
          NEWSROOM_S3_BUCKET: !Ref NewsroomS3Bucket
          NEWSROOM_ADMIN_API_KEY: !Sub '{{resolve:secretsmanager:${NewsroomAdminApiKeySecretArn}}}'
          # NEWSROOM_DEV_AUTH_BYPASS intentionally absent — never set in this template.
      Policies:
        # Least-privilege S3 policy — see the Phase 6A report's exact
        # action enumeration (grepped from api/_lib/s3.ts): only GetObject
        # (download for PDF processing + the public image proxy — AWS's
        # HeadObject API is authorized under the same s3:GetObject action)
        # and PutObject (to generate presigned upload URLs; the actual PUT
        # is performed by the browser against S3 directly, never by
        # Lambda, but generating the presigned URL requires the signing
        # principal to hold this permission).
        #
        # DeleteObject and ListBucket were added for the Newsroom admin's
        # permanent article-delete flow (deleteArticle -> S3's
        # deleteObjectsWithPrefix, see api/_lib/s3.ts): deleting an
        # article's images/source PDF requires first listing everything
        # under its own newsroom/articles/{id}/ prefix (ListObjectsV2),
        # then deleting exactly those keys (DeleteObjects). ListBucket is
        # scoped to the bucket resource itself (that's the only ARN shape
        # S3 accepts for a list action) but constrained with an s3:prefix
        # condition to the same newsroom/articles/ tree every other action
        # here is already confined to — this Lambda still can never list or
        # delete anything outside that tree.
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
              Resource: !Sub 'arn:aws:s3:::${NewsroomS3Bucket}/newsroom/articles/*'
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub 'arn:aws:s3:::${NewsroomS3Bucket}'
              Condition:
                StringLike:
                  's3:prefix': 'newsroom/articles/*'
        - VPCAccessPolicy: {}
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            Path: /api/newsroom/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [aws/newsroom-lambda.ts]
        Minify: false
        Target: node22
        Sourcemap: true
        External: ['@aws-sdk/*'] # already present in the Node 22 Lambda runtime image — excluding it keeps the deployment package small.

  # Phase 6 — scheduled publishing. A single system-wide poller (rate(1
  # minute)), not one schedule per article: RDS is the sole source of
  # scheduling truth (see aws/newsroom-lambda.ts's
  # runScheduledPublishingWorker doc comment) — there is no per-article AWS
  # resource here to create, track, or clean up, deliberately, since a
  # one-time schedule per publish/unpublish event would need its own
  # stale-event-detection design (an edited/cancelled schedule vs. an
  # already-in-flight invocation) that this poller design doesn't need at
  # all: every tick just re-reads current RDS state fresh. No new IAM
  # permissions on NewsroomFunction's own execution role — it never calls
  # any EventBridge/Scheduler API itself, it's only ever invoked BY this
  # Rule. No @aws-sdk/client-scheduler or @aws-sdk/client-eventbridge
  # dependency needed as a result.
  ScheduledPublishingRule:
    Type: AWS::Events::Rule
    Properties:
      Name: menasco-newsroom-scheduled-publishing-worker
      Description: Invokes menasco-newsroom-api once a minute to execute any due scheduled article publish/unpublish transitions. RDS is authoritative — this Lambda re-checks current state on every invocation rather than trusting the event itself.
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Arn: !GetAtt NewsroomFunction.Arn
          Id: NewsroomScheduledPublishingTarget

  # Grants ONLY this specific Rule's ARN (via SourceArn) permission to
  # invoke this specific function — the sole new IAM surface this feature
  # introduces. aws/newsroom-lambda.ts's own SCHEDULED_WORKER_RULE_NAME
  # check is a second, independent gate on top of this (defense in depth:
  # even a Lambda-level misconfiguration elsewhere couldn't make an
  # unrelated event trigger publication logic).
  ScheduledPublishingRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NewsroomFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduledPublishingRule.Arn

Outputs:
  ApiEndpoint:
    Description: Invoke URL for the HTTP API — this is what Amplify's rewrite (see Phase 6A report) proxies /api/newsroom/* to.
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
